# ============================================================
#  바로위키 — Netlify 앞단 설정
#
#  Netlify 는 도메인 · HTTPS · CDN 만 맡고,
#  위키(Go 서버)는 다른 곳에서 돌린 뒤 모든 요청을 그쪽으로 넘긴다.
#
#  지금은 "준비 중" 상태다. 위키 서버 주소가 정해지면
#  아래 [운영 시작] 두 줄만 고치면 된다. (자세한 것은 배포_안내.md)
# ============================================================

[build]
  # Netlify 가 그대로 올릴 폴더 (점검 · 준비 중 화면 하나뿐이다)
  publish = "netlify"
  # 빌드할 것이 없다. 위키는 Netlify 밖에서 돈다.
  command = ""

# Netlify 쪽에는 환경변수가 필요 없다.
# 위키가 쓰는 값(NAMU_DB · TZ 등)은 전부 원본 서버에 넣는다. (배포_안내.md)


# ------------------------------------------------------------
#  1. 언제나 Netlify 가 직접 답하는 곳
#
#     위키 서버가 죽어도 이 주소는 열린다.
#     장애 때 이용자에게 알릴 자리로 쓴다.
# ------------------------------------------------------------

[[redirects]]
  from = "/_status"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/_status/*"
  to = "/index.html"
  status = 200


# ------------------------------------------------------------
#  2. [운영 시작] 위키 서버로 넘기기
#
#     아래 두 줄의 # 을 지우고 ORIGIN 을 실제 주소로 바꾼다.
#     예) to = "https://barowiki.fly.dev/:splat"
#
    status = 200
    force  = true → publish
# ------------------------------------------------------------

 [[redirects]]
   from = "/*"
   to = "barowiki.site"
   status = 200
   force = true


# ------------------------------------------------------------
#  3. 준비 중 화면 (위 2번을 켜면 자동으로 안 쓰인다)
# ------------------------------------------------------------
#여기는 건드리면안돼ㅇㅇㅇ동규야 내 파일이랑 니 파일 취합하자 나 구현 많이 함ㅇㅇㅇ 너가 쓴거 클로드한테 복사해서 붙여넣어서 통합해달라 하셈ㅇㅇ
#복붙 얼케 하 이농미 내가 함 ㄱㄷㄱㄷ 한는ㅇ중주 
#언젠간 진짜 해야해해
#쥰죠우 나니소레 아이죠우 나니소레 오이시이놋네 오이시이놋테나
#란보우 다메다메 칸죠우 스테사리
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# ------------------------------------------------------------
#  4. 응답 헤더
#
#     내용 보안 정책(CSP)은 넣지 않는다.
#     위키가 인라인 스크립트·스타일을 쓰기 때문에 화면이 깨진다.
# ------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# 준비 중 화면은 오래 담아 두지 않는다 (운영 전환이 바로 보이도록)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
