# ============================================================
#  바로위키 — Netlify 앞단 설정
#
#  Netlify 는 도메인 · HTTPS · CDN 만 맡고,
#  위키(Go 서버)는 다른 곳에서 돌린 뒤 모든 요청을 그쪽으로 넘긴다.
#
#  지금은 "준비 중" 상태다. 위키 서버 주소가 정해지면
#  아래 2번의 세 줄만 고치면 된다. (자세한 것은 배포_안내.md)
# ============================================================

[build]
  # Netlify 가 그대로 올릴 폴더 (준비 중 화면 하나뿐이다)
  publish = "netlify"
  # 빌드할 것이 없다. 위키는 Netlify 밖에서 돈다.
  command = ""

# Netlify 쪽에는 환경변수가 필요 없다.
# 위키가 쓰는 값(NAMU_DB · TZ 등)은 전부 원본 서버에 넣는다. (배포_안내.md)


# ------------------------------------------------------------
#  규칙은 위에서부터 차례로 맞춰 보고, 처음 맞는 하나만 쓴다.
#  그래서 순서가 곧 우선순위다. 1 → 2 → 3.
# ------------------------------------------------------------

# ------------------------------------------------------------
#  1. 언제나 Netlify 가 직접 답하는 곳
#
#     위키 서버가 죽어도 이 주소는 열린다.
#     장애 때 이용자에게 알릴 자리로 쓴다.
# ------------------------------------------------------------

[[redirects]]
  from = "/_status"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/_status/*"
  to = "/index.html"
  status = 200


# ------------------------------------------------------------
#  2. [운영 시작] 위키 서버로 넘기기
#
#     위키 서버를 띄운 뒤, 아래 다섯 줄의 맨 앞 # 을 지우고
#     to = 의 주소를 실제 원본 주소로 바꾼다.
#
#     · 주소는 https:// 로 시작하는 온전한 주소여야 한다.
#     · 끝의 /:splat 을 빼먹으면 모든 요청이 첫 화면으로 몰린다.
#     · 이 도메인(barowiki.site) 을 그대로 적으면 안 된다.
#       자기 자신에게 넘기는 꼴이라 무한히 돈다.
#       적어야 하는 것은 위키가 실제로 도는 곳(예: fly.io) 이다.
# ------------------------------------------------------------

[[redirects]]
  from = "/*"
  to = "https://barowiki-dg.fly.dev/:splat"
  status = 200
  force = true


# ------------------------------------------------------------
#  3. 준비 중 화면 (위 2번을 켜면 자동으로 안 쓰인다)
# ------------------------------------------------------------

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# ------------------------------------------------------------
#  4. 응답 헤더
#
#     내용 보안 정책(CSP)은 넣지 않는다.
#     위키가 인라인 스크립트·스타일을 쓰기 때문에 화면이 깨진다.
# ------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# 준비 중 화면은 오래 담아 두지 않는다 (운영 전환이 바로 보이도록)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"


