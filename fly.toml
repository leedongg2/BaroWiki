# ============================================================
#  바로위키 — Fly.io 용 (SQLite 를 그대로 쓸 때 가장 손이 덜 간다)
#
#    fly launch --no-deploy --copy-config     앱 만들기
#    fly volumes create wiki_data --size 3    저장 공간 (GB)
#    fly deploy                               올리기
#
#  app 이름은 실제로 만든 이름으로 바꾼다.
# ============================================================

app = "barowiki-dg"
primary_region = "nrt"          # 도쿄 (한국에서 가장 가깝다)

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "Asia/Seoul"
  NAMU_DB = "data/wiki"
  NAMU_DB_TYPE = "sqlite"

# DB · 올린 파일 · 설정이 전부 여기에 남는다.
# 이것이 없으면 배포할 때마다 위키가 초기화된다.
[[mounts]]
  source = "wiki_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true

  # SQLite 는 한 대에서만 써야 한다. 절대 여러 대로 늘리지 않는다.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 120

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
